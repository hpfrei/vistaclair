<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horst</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/pro/horst/horst.css">
</head>
<body>
  <div class="horst-shell">
    <nav class="horst-rail">
      <div class="horst-brand" title="Horst — resident agent">
        <span class="horst-glyph">H</span>
      </div>
      <button class="rail-btn" data-view="map" title="Map — how Horst works">
        <svg viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="19" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="19" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path class="rail-wire" d="M7.4 11L16.6 6.8M7.4 13l9.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Map</span>
        <em class="rail-live" id="liveDot" title="live"></em>
      </button>
      <button class="rail-btn" data-view="arch" title="Architecture — what Horst is made of">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="14" y="3" width="7" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3" y="16" width="7" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="14" y="16" width="7" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M6.5 8v3h11V8M12 11v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Architecture</span>
      </button>
      <button class="rail-btn active" data-view="chat" title="Chat">
        <svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Chat</span>
      </button>
      <button class="rail-btn" data-view="timeline" title="Timeline — everything that happened">
        <svg viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".45"/>
          <circle class="rail-tick" cx="8" cy="6" r="2.1" fill="currentColor"/>
          <circle class="rail-tick" cx="14" cy="12" r="2.1" fill="currentColor"/>
          <circle class="rail-tick" cx="10" cy="18" r="2.1" fill="currentColor"/>
        </svg>
        <span>Timeline</span>
      </button>
      <button class="rail-btn" data-view="todos" title="Todos — reminders and waiting-fors">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 12.5l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Todos</span>
        <em class="rail-badge" id="todoBadge" style="display:none"></em>
      </button>
      <button class="rail-btn" data-view="files" title="Files — everything Horst delivered to you">
        <svg viewBox="0 0 24 24"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 11v5M9.5 13.5L12 16l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Files</span>
      </button>
      <button class="rail-btn" data-view="brain" title="Brain — browse what Horst knows">
        <svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 0 0-4 4 3.5 3.5 0 0 0-2.8 4.6A3.5 3.5 0 0 0 6 18a4 4 0 0 0 6 3.5A4 4 0 0 0 18 18a3.5 3.5 0 0 0 .8-6.4A3.5 3.5 0 0 0 16 7a4 4 0 0 0-4-4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 7v13M9 11h6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".55"/></svg>
        <span>Brain</span>
      </button>
      <button class="rail-btn" data-view="approvals" title="Approvals">
        <svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Approvals</span>
        <em class="rail-badge" id="appBadge" style="display:none"></em>
      </button>
      <button class="rail-btn" data-view="directives" title="Directives — your standing orders">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Directives</span>
        <em class="rail-badge" id="dirBadge" style="display:none"></em>
      </button>
      <button class="rail-btn" data-view="settings" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Settings</span>
      </button>
      <div class="rail-spacer"></div>
      <div class="rail-status" id="railStatus" title=""></div>
    </nav>
    <main class="horst-main" id="horstMain"></main>
  </div>
  <script src="/pro/vc-markdown.js"></script>
  <script src="/pro/horst/horst-live.js"></script>
  <script src="/pro/horst/horst-map.js"></script>
  <script src="/pro/horst/horst-arch.js"></script>
  <script src="/pro/horst/horst-artifact-chips.js"></script>
  <!-- Shared with the Telegram Mini App: renders the card descriptor the
       server derives for every kind. Deliberately not a /pro/vc-*.js name,
       which the bundler would claim and weld to vc-core. -->
  <script src="/pro/proposal-cards.js"></script>
  <script src="/pro/horst/horst.js"></script>
</body>
</html>
