<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vistaclair - Login</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1b26;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      color: #c0caf5;
    }
    .login-box {
      background: #24283b;
      border: 1px solid #414868;
      border-radius: 8px;
      padding: 32px;
      width: 340px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      color: #565f89;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #565f89;
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      background: #1a1b26;
      border: 1px solid #414868;
      border-radius: 4px;
      color: #c0caf5;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    input[type="password"]:focus {
      border-color: #7aa2f7;
    }
    .error {
      font-size: 11px;
      color: #f7768e;
      margin-top: 8px;
      display: none;
    }
    .error.visible { display: block; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 8px;
      background: #7aa2f7;
      color: #1a1b26;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #89b4fa; }
    #tg-panel { display: none; }
    .tg-code {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;
      text-align: center;
      color: #7aa2f7;
      background: #1a1b26;
      border: 1px solid #414868;
      border-radius: 4px;
      padding: 14px 0;
      margin: 12px 0;
      user-select: all;
    }
    .tg-hint { font-size: 11px; color: #565f89; line-height: 1.5; }
    .tg-status { font-size: 11px; color: #565f89; margin-top: 12px; text-align: center; }
    .tg-status.ok { color: #9ece6a; }
    .spinner {
      display: inline-block; width: 10px; height: 10px; margin-right: 6px;
      border: 2px solid #414868; border-top-color: #7aa2f7; border-radius: 50%;
      animation: spin 0.9s linear infinite; vertical-align: -1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alt-link { font-size: 11px; color: #565f89; margin-top: 16px; text-align: center; cursor: pointer; text-decoration: underline; }
    .alt-link:hover { color: #7aa2f7; }
  </style>
</head>
<body>
  <div class="login-box">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><svg width="24" height="24" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="vc-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#cc3344"/><stop offset="25%" stop-color="#c07020"/><stop offset="50%" stop-color="#1a8a3a"/><stop offset="75%" stop-color="#2255aa"/><stop offset="100%" stop-color="#7744bb"/></linearGradient></defs><ellipse cx="32" cy="32" rx="29" ry="18" fill="#fff" stroke="#aaa" stroke-width="1.5"/><circle cx="32" cy="32" r="13" fill="url(#vc-g)"/><circle cx="32" cy="32" r="5.5" fill="#1a1a2e"/><circle cx="28" cy="28" r="2.5" fill="#fff"/></svg><h1>vistaclair</h1></div>

    <div id="tg-panel">
      <div class="subtitle">Login via Telegram</div>
      <div class="tg-hint">Send this code to your vistaclair login bot:</div>
      <div class="tg-code" id="tg-code">·····</div>
      <div class="tg-status" id="tg-status"><span class="spinner"></span>Waiting for Telegram…</div>
      <div class="alt-link" id="show-token">Use auth token instead</div>
    </div>

    <form id="token-form" method="POST" action="/login">
      <div class="subtitle">Enter your auth token to continue</div>
      <label for="token">Auth token</label>
      <input type="password" id="token" name="token" autocomplete="off" autofocus required>
      <div class="error" id="error">Invalid token</div>
      <button type="submit">Login</button>
    </form>
  </div>
  <script src="login.js"></script>
</body>
</html>
